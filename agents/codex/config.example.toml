# Merge selected values into ~/.codex/config.toml after backing it up.
# Runtime paths, authentication, project trust, and generated state stay local.
model = "gpt-6.1-sol"
model_reasoning_effort = "medium"

[tui]
theme = "catppuccin-mocha"
status_line = ["model-with-reasoning", "current-dir", "thread-name", "git-branch", "context-used", "five-hour-limit", "weekly-limit"]
status_line_use_colors = true
