# install-ci.conf.yaml

- defaults:
    link:
      relink: true

- clean: ["~"]

- create:
    - ~/.zsh
    - ~/.ssh
    - ~/.gnupg

- link:
    # Personal agent instructions (existing regular files require a manual backup)
    # ~/.codex/AGENTS.md:
    #   path: agents/codex/AGENTS.md
    #   create: true
    # ~/.claude/CLAUDE.md:
    #   path: agents/claude/CLAUDE.md
    #   create: true
    # Domain-organized shell files
    ~/.zsh/git.zsh: shell/.zsh/git.zsh
    ~/.zsh/system.zsh: shell/.zsh/system.zsh
    ~/.zsh/dev.zsh: shell/.zsh/dev.zsh
    ~/.zsh/apps.zsh: shell/.zsh/apps.zsh
    ~/.zsh/security.zsh: shell/.zsh/security.zsh
    ~/.zsh/personal.zsh: shell/.zsh/personal.zsh
    ~/.zsh/.p10k.zsh: shell/.zsh/.p10k.zsh
    ~/.zsh/.zsh_plugins.txt: shell/.zsh/.zsh_plugins.txt
    ~/.zsh/.test-aliases: shell/.zsh/.test-aliases
    ~/.zsh/test-runner.sh: shell/.zsh/test-runner.sh
    ~/.zsh/.exports: shell/.exports
    ~/.zsh/.env: shell/.env
    ~/.zshenv:
      force: true
      path: shell/.zshenv
    ~/.zshrc:
      path: shell/.zshrc
      force: true
    ~/.vimrc: shell/.vimrc
    ~/.actrc: .actrc
    ~/.ssh/config:
      path: ssh/config
      force: true
      create: true
    ~/.gitconfig: git/.gitconfig
    ~/.gitignore_global: git/.gitignore_global
    # ~/.config apps
    ~/.config/gh/config.yml:
      path: config/gh/config.yml
      create: true
    ~/.config/mise/config.toml:
      path: config/mise/config.toml
      create: true
    ~/.config/mole/whitelist:
      path: config/mole/whitelist
      create: true
    ~/.config/zed/settings.json:
      path: config/zed/settings.json
      create: true
    ~/.finicky.js: .finicky.js
    ~/.mackup.cfg: .mackup.cfg
    ~/.gnupg/gpg-agent.conf:
      path: shell/gpgagent
      force: true
      create: true

- shell:
    - [git submodule update --init --recursive, Syncing submodules]
