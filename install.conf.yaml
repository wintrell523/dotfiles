# install.conf.yaml
- defaults:
    link:
      relink: true

- clean: ["~"]

- create:
    - ~/.zsh

- link:
    # Shell stuff
    ~/.zsh/.aliases: shell/.zsh/.aliases
    ~/.zsh/.functions: shell/.zsh/.functions
    ~/.zsh/.p10k.zsh: shell/.zsh/.p10k.zsh
    # ~/.functions: shell/.functions
    ~/.zshrc: shell/.zshrc
    ~/.vimrc: shell/.vimrc
    # Node
    ~/.npmrc: node/.npmrc
    ~/.yarnrc: node/.yarnrc
    # SSH
    ~/.ssh/config: ssh/config
    # Git
    ~/.gitconfig: git/.gitconfig
    ~/.gitignore_global: git/.gitignore_global
    # VSC
    ~/Library/Application Support/Code/User/settings.json: vscode/settings.json
    ~/Library/Application Support/Code/User/snippets/cypress_snippets.code-snippets: vscode/snippets/cypress_snippets.code-snippets

- shell:
    - [git submodule update --init --recursive, Installing submodules]

- brewfile:
    # This accepts the same options as `brew bundle` command:
    file: Brewfile

- vscodefile:
    file: vscode_extensions
    insiders: false
