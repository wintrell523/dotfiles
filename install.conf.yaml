# install.conf.yaml
- defaults:
    link:
      relink: true

- clean: ["~"]

- create:
    - ~/.zsh
    - ~/.ssh
    - ~/.gnupg

- link:
    # Domain-organized shell files
    ~/.zsh/git.zsh: shell/.zsh/git.zsh
    ~/.zsh/system.zsh: shell/.zsh/system.zsh
    ~/.zsh/dev.zsh: shell/.zsh/dev.zsh
    ~/.zsh/apps.zsh: shell/.zsh/apps.zsh
    ~/.zsh/security.zsh: shell/.zsh/security.zsh
    ~/.zsh/personal.zsh: shell/.zsh/personal.zsh
    ~/.zsh/.p10k.zsh: shell/.zsh/.p10k.zsh
    ~/.zsh/.test-aliases: shell/.zsh/.test-aliases
    ~/.zsh/test-runner.sh: shell/.zsh/test-runner.sh
    ~/.zsh/.exports: shell/.exports
    ~/.zsh/.env: shell/.env
    ~/.zprofile:
      force: true
      path: shell/.zprofile
    ~/.zshrc:
      force: true
      path: shell/.zshrc
    ~/.vimrc:
      relink: true
      path: shell/.vimrc
    ~/.actrc: .actrc
    # SSH:
    ~/.ssh/config:
      path: ssh/config
      force: true
      create: true
    # Git
    ~/.gitconfig: git/.gitconfig
    ~/.gitignore_global: git/.gitignore_global
    # # VSC
    # "~/Library/Application Support/Code/User/settings.json":
    #   path: vscode/settings.json
    #   create: true
    # ~/Library/Application Support/Code/User/snippets/cypress_snippets.code-snippets: vscode/snippets/cypress_snippets.code-snippets
    # Finicky (browser routes)
    ~/.finicky.js: .finicky.js
    # Mackup config
    ~/.mackup.cfg: .mackup.cfg
    # GPG:
    ~/.gnupg/gpg-agent.conf:
      path: shell/gpgagent
      force: true
      create: true

- shell:
    - [git submodule update --init --recursive, Installing submodules]
# This apply to all commands that come after setting the defaults.
- defaults:
    brewfile:
      stdout: true
      stderr: true
      # include: ["tap", "brew"]
      include: ["tap", "brew", "cask", "mas"]
- brewfile:
    # This accepts the same options as `brew bundle` command:
    file: Brewfile

- brewfile:
    file: Brewfile
    no-upgrade: true
    stdout: true
    stderr: true
    # Brewfile now has vscode plugins:
    include: ["vscode"]
